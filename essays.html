<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESSAYS — TAKAGI Kaede</title>
<meta name="description" content="TAKAGI Kaede によるエッセイ・ノート。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
<section class="sec">
  <div class="head"><h2 id="essayTitle"></h2></div>
  <div class="essays" id="essayList"></div>
</section>
</div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
buildNav('essays');buildFooter();
const lang=getLang(),TT=T[lang];
$('#essayTitle').textContent=TT.titles.essays;
document.documentElement.lang=lang==='jp'?'ja':'en';

// 一覧の下には本文の最初の一文を表示（長い場合は CSS で自動的に「…」）
function firstSentence(body){
  const t=body.join('\n').split('\n').map(l=>l.replace(/^[\s\u3000]+/,'')).filter(Boolean).join('\n');
  let depth=0;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==='「'||c==='『'||c==='（')depth++;
    else if((c==='」'||c==='』'||c==='）')&&depth>0){depth--;if(depth===0&&t[i+1]==='\n')return t.slice(0,i+1).replace(/\n/g,' ');}
    else if(depth===0&&'。！？'.includes(c))return t.slice(0,i+1).replace(/\n/g,' ');
  }
  return t.replace(/\n/g,' ');
}
const g=$('#essayList');
ESSAYS.forEach(e=>{
    g.insertAdjacentHTML('beforeend',
    `<a href="essay.html?id=${e.id}" lang="ja">
       <div class="date">${e.date}</div>
       <div><div class="tt">${e.title}</div><div class="ex">${firstSentence(e.body)}…</div></div>
       <div class="tag">ESSAY</div>
     </a>`);
});
</script>
</body>
</html>
