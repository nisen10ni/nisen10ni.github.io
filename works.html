<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORKS — TAKAGI Kaede</title>
<meta name="description" content="TAKAGI Kaede の映像・パフォーマンス作品一覧（2023–2026）。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
<section class="sec">
  <div class="head"><h2 id="worksTitle"></h2><div class="eyebrow">— WORKS</div></div>
  <div class="years" id="years"></div>
  <div id="workList"></div>
</section>
</div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
buildNav('works');buildFooter();
const lang=getLang(),TT=T[lang];
$('#worksTitle').textContent=TT.titles.works;
document.documentElement.lang=lang==='jp'?'ja':'en';
let yearFilter='all';

function renderYears(){
  const years=[...new Set(WORKS.map(w=>w.year))].sort((a,b)=>b-a);
  const box=$('#years'); box.innerHTML='';
  const all=document.createElement('button'); all.textContent=TT.all; all.dataset.year='all';
  if(yearFilter==='all')all.classList.add('active');
  box.appendChild(all);
  years.forEach(y=>{const b=document.createElement('button');b.textContent=y;b.dataset.year=y;
    if(String(yearFilter)===String(y))b.classList.add('active');box.appendChild(b);});
  box.onclick=e=>{const b=e.target.closest('button');if(!b)return;yearFilter=b.dataset.year==='all'?'all':+b.dataset.year;renderYears();renderWorks();};
}

function renderWorks(){
  const list=$('#workList'); list.innerHTML='';
  const filtered=yearFilter==='all'?WORKS:WORKS.filter(w=>w.year===yearFilter);
  const years=[...new Set(filtered.map(w=>w.year))].sort((a,b)=>b-a);
  years.forEach(y=>{
    const block=document.createElement('div'); block.className='yearblock';
    block.innerHTML=`<div class="yearttl">${y}</div><div class="cards"></div>`;
    const cards=block.querySelector('.cards');
    filtered.filter(w=>w.year===y).forEach(w=>{
      const card=document.createElement('div'); card.className='card'; card.dataset.id=w.id;
      card.innerHTML=`
        <div class="thumb"><img src="${w.images[0].src}" alt="" loading="lazy"></div>
        <div class="cbottom">
          <div>
            <div class="ctitle">${w.title[lang==='jp'?0:1]}</div>
            <div class="csub">${w.tag[lang==='jp'?0:1]}</div>
          </div>
          <div class="cyear">${w.year}</div>
        </div>`;
      card.onclick=()=>openWork(w);
      cards.appendChild(card);
    });
    list.appendChild(block);
  });
}
renderYears();renderWorks();
</script>
</body>
</html>
