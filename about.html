<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABOUT — TAKAGI Kaede</title>
<meta name="description" content="TAKAGI Kaede のプロフィール・展示歴。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
<section class="sec">
  <div class="head"><h2 id="aboutTitle"></h2></div>
  <div class="aboutgrid">
    <figure class="portrait has-img"><img id="portraitImg" src="images/about/01.jpg" alt="" width="1600" height="1066"></figure>
    <div class="about">
      <h3 id="aboutName"></h3>
      <div class="subname" id="aboutSub"></div>
      <p class="bio" id="aboutBio"></p>
      <div class="cv" id="cv"></div>
    </div>
  </div>
</section>
</div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
buildNav('about');buildFooter();
const lang=getLang(),TT=T[lang];
$('#aboutTitle').textContent=TT.titles.about;
$('#aboutName').textContent=TT.name;
$('#aboutSub').textContent=TT.subname;
$('#aboutBio').textContent=TT.bio;
$('#portraitImg').alt=TT.portraitAlt;
document.documentElement.lang=lang==='jp'?'ja':'en';
// 略歴：見出しの下に「年｜内容」の2列で並べる（同じ年が続くときは2行目以降の年を省略）
const cv=$('#cv');
TT.dl.forEach(([k,vals])=>{
  let prev='';
  const rows=vals.map(v=>{
    const m=v.match(/^(\d{4})[\s　]+(.*)$/);
    const y=m?m[1]:'', txt=m?m[2]:v;
    const show=y&&y!==prev?y:''; if(y)prev=y;
    return `<div class="cvrow"><div class="cvy">${show}</div><div class="cvt">${txt}</div></div>`;
  }).join('');
  cv.insertAdjacentHTML('beforeend',`<h4>${k}</h4><div class="cvlist">${rows}</div>`);
});
</script>
</body>
</html>
