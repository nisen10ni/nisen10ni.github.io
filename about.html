<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABOUT — TAKAGI Kaede</title>
<meta name="description" content="TAKAGI Kaede のプロフィール・展示歴・活動・ステートメント。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
<section class="sec">
  <div class="head"><h2 id="aboutTitle"></h2><div class="eyebrow">— ABOUT</div></div>
  <div class="aboutgrid">
    <figure class="portrait has-img"><img id="portraitImg" src="images/about/01.jpg" alt=""><small>Photo: 黒坂ひな</small></figure>
    <div class="about">
      <h3 id="aboutName"></h3>
      <div class="subname" id="aboutSub"></div>
      <p class="bio" id="aboutBio"></p>
      <dl class="dl" id="profileDL"></dl>
    </div>
  </div>
</section>
</div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
buildNav('about');buildFooter();
const lang=getLang(),TT=T[lang];
$('#aboutTitle').textContent=TT.titles.about;
$('#aboutName').textContent=TT.name;
$('#aboutSub').textContent=TT.subname;
$('#aboutBio').textContent=TT.bio;
$('#portraitImg').alt=TT.portraitAlt;
document.documentElement.lang=lang==='jp'?'ja':'en';
const dl=$('#profileDL');
TT.dl.forEach(([k,vals])=>{
  dl.insertAdjacentHTML('beforeend',`<dt>${k}</dt><dd>${vals.map(v=>v.replace(/^(\d{4})/,'<span class="yr">$1</span>')).join('<br>')}</dd>`);
});
</script>
</body>
</html>
